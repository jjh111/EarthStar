    <!-- the resting claw -->
    <path d="M30 56 L22 48 M22 48 C15 47 13 40 18 36 C21 39 23 43 22 48"/>
    <!-- the raised claw, holding what it was handed -->
    <g class="gp-claw">
      <path d="M66 56 L73 44 M73 44 C69 37 72 30 78 29 C82 32 82 40 73 44"/>
      <path class="gp-gold" d="M75 33 l5 -2 l1 5 l-5 1 z"/>
