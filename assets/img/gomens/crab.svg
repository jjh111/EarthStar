  <path class="gp-faint" d="M6 86 H90"/>
  <path class="gp-faint" d="M16 91 h5 M44 91 h8 M74 91 h5"/>
  <text class="gp-beep" x="62" y="13">beep</text>
  <g class="gp-scuttle">
