<svg class="gomen-svg gp-being" viewBox="0 0 96 96" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" overflow="hidden">
  <!-- a circle of people, heads outward, shoulders turned in, joined by a
       dotted ring: holding what no one holds alone -->
  <g transform="translate(48 50) scale(1.24) translate(-48 -50)">
  <g class="gp-people">
    <circle class="gp-faint" cx="48" cy="50" r="27" stroke-dasharray="0.1 4.2" stroke-width="2.2"/>
    <g id="gp-person">
      <circle cx="48" cy="16" r="3.8"/>
      <path d="M40.5 27.5 Q48 20.5 55.5 27.5"/>
    </g>
    <use href="#gp-person" transform="rotate(60 48 50)"/>
    <use href="#gp-person" transform="rotate(120 48 50)"/>
    <use href="#gp-person" transform="rotate(180 48 50)"/>
    <use href="#gp-person" transform="rotate(240 48 50)"/>
    <use href="#gp-person" transform="rotate(300 48 50)"/>
  </g>
  <!-- the heart they keep between them -->
  <path class="gp-heart" d="M48 58.5 C39 52 37 45.5 41.5 42.5 C44.8 40.4 48 42.8 48 45.5 C48 42.8 51.2 40.4 54.5 42.5 C59 45.5 57 52 48 58.5 Z"/>
  </g>
</svg>
