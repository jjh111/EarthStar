  <g class="gp-turn">
    <!-- the Y: two heavy chains joined at the hinge -->
    <path d="M44 82 V57 L25 38 L30 33 L48 51 L66 33 L71 38 L52 57 V82 Z"/>
    <!-- light chains alongside each arm -->
