<svg class="gomen-svg gp-antibody" viewBox="0 0 96 96" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" overflow="hidden">
  <!-- the vessel: two soft walls of a blood vessel -->
  <path class="gp-faint" d="M4 14 C30 8 66 8 92 14 M4 88 C30 94 66 94 92 88"/>
