<svg xmlns="http://www.w3.org/2000/svg" class="picto" viewBox="0 0 120 120" role="img" aria-label="The Steiner tree"><style>text{font-family:'Cormorant Garamond',serif;fill:#2a1d12}path,line,polyline,polygon,circle,ellipse{fill:none;stroke:#2a1d12;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}.fill{fill:#2a1d12;stroke:none}.paper{fill:#efe4c8}.thin{stroke-width:.8;opacity:.7}a{fill:inherit}.ret{stroke:#3d6e60}.w{fill:#8a2c1c;font-style:italic}.r{fill:#3d6e60;font-style:italic}.head{font-size:15px;fill:#6b4a2e;letter-spacing:.1em}.bin{font-style:italic}.cn{fill:#8a7458;font-size:16px}.ord{font-size:15px;fill:#6b4a2e;letter-spacing:.08em}.king{font-size:20px;letter-spacing:.1em}.dom{font-size:26px;letter-spacing:.12em}.scale,.tick{font-size:16px;font-style:italic;fill:#6b4a2e}.sp{font-size:17px}</style><polyline points="20,30 37.3,60 20,90" /><polyline points="37.3,60 82.7,60" /><polyline points="100,30 82.7,60 100,90" /><circle cx="20" cy="30" r="4" class="paper"/><circle cx="100" cy="30" r="4" class="paper"/><circle cx="100" cy="90" r="4" class="paper"/><circle cx="20" cy="90" r="4" class="paper"/><circle cx="37.3" cy="60" r="2" class="fill"/><circle cx="82.7" cy="60" r="2" class="fill"/></svg>