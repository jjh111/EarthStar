<svg class="gomen-svg gp-crab" viewBox="0 0 96 96" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" overflow="hidden">
  <defs>
    <linearGradient id="gp-crab-shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e98aa8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#e9b92c" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7fc6b0" stop-opacity="0.45"/>
    </linearGradient>
  </defs>
  <!-- the shore -->
  <path class="gp-faint" d="M4 86 H92 M14 91 h6 M40 91 h10 M70 91 h8"/>
  <text class="gp-beep" x="58" y="12">beep</text>
  <g class="gp-scuttle">
    <!-- legs -->
    <path d="M30 61 L20 66 L16 75 M31 65 L23 72 L20 81 M35 68 L29 78 M66 61 L76 66 L80 75 M65 65 L73 72 L76 81 M61 68 L67 78"/>
    <!-- shell, iridescent -->
    <ellipse cx="48" cy="58" rx="20" ry="12" fill="url(#gp-crab-shell)"/>
    <path class="gp-faint" d="M36 55 Q48 49 60 55"/>
    <!-- eyes on stalks -->
    <path d="M43 47 L41 39 M53 47 L55 39"/>
    <circle cx="41" cy="37" r="2.2" fill="currentColor"/>
    <circle cx="55" cy="37" r="2.2" fill="currentColor"/>
    <!-- resting claw -->
    <path d="M30 55 L22 47 M22 47 C15 46 13 39 18 35 M22 47 C25 42 23 37 18 35"/>
    <!-- the raised claw, holding what it was handed -->
    <g class="gp-claw">
      <path d="M66 54 L74 42 M74 42 C70 35 73 28 79 27 M74 42 C80 41 84 34 79 27"/>
      <path class="gp-gold" d="M76 33 L81 31 L82 36 L77 37 Z"/>
    </g>
  </g>
</svg>
