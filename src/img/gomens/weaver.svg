<svg class="gomen-svg gp-weaver" viewBox="0 0 96 96" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" overflow="hidden">
  <!-- hyphae: the outer ring of connections -->
  <path d="M18 30 Q32 18 48 16 Q64 18 78 30 Q84 52 72 72 Q48 84 26 74 Q12 54 18 30"/>
  <!-- spokes, faint: links that are not woven yet -->
  <path class="gp-faint" d="M48 48 L18 30 M48 48 L48 16 M48 48 L78 30 M48 48 L26 74"/>
  <!-- branching tips, still growing -->
  <path class="gp-faint" d="M18 30 l-8 -5 M48 16 l2 -9 M78 30 l9 -4 M72 72 l8 6 M26 74 l-9 6"/>
  <!-- the thread being woven right now -->
  <path class="gp-gold gp-thread" d="M18 30 Q36 40 48 48 Q60 58 72 72"/>
  <!-- nodes -->
  <g class="gp-nodes" fill="var(--bg, #e4d7b8)">
    <circle cx="18" cy="30" r="3.6"/>
    <circle cx="48" cy="16" r="3.6"/>
    <circle cx="78" cy="30" r="3.6"/>
    <circle cx="72" cy="72" r="3.6"/>
    <circle cx="26" cy="74" r="3.6"/>
  </g>
  <circle class="gp-gold gp-heart" cx="48" cy="48" r="5.5"/>
</svg>
