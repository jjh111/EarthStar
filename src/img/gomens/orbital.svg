<svg class="gomen-svg gp-orbital" viewBox="0 0 96 96" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" overflow="hidden">
  <!-- Earth's limb -->
  <circle cx="48" cy="150" r="72"/>
  <path class="gp-faint" d="M18 90 q10 -5 18 -2 M58 84 q8 -3 16 1"/>
  <!-- low orbit -->
  <circle class="gp-faint gp-orbit" cx="48" cy="150" r="108" stroke-dasharray="2 5"/>
  <!-- loose debris further along the orbit -->
  <path class="gp-gold gp-drift" d="M84 18 l5 -2 l1 5 z"/>
  <g class="gp-patrol"><g transform="translate(-30 -24) scale(1.6)">
    <!-- the consolidator: body, panels -->
    <rect x="42" y="38" width="10" height="9" rx="1"/>
    <path d="M28 40 h12 v5 h-12 z M54 40 h12 v5 h-12 z M34 40 v5 M60 40 v5"/>
    <path d="M47 38 v-5 M44.5 33 h5"/>
    <!-- the net, gathering -->
    <path class="gp-faint" d="M52 44 L70 32 M52 44 L70 56 M70 32 Q76 44 70 56 M62 38 Q66 44 62 50"/>
    <path class="gp-gold" d="M64 40 l3 -2 l1 3 z M66 48 l4 1 l-2 3 z"/>
  </g></g>
</svg>
