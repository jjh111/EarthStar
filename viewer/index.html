<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Earth Star Viewer — live space weather</title>
  <meta name="description" content="Live 3D view of Earth's space-weather environment: solar wind, geomagnetic field, aurora and solar imagery from NOAA SWPC, every value carrying its source, timestamp and evidence tier." />
  <link rel="canonical" href="https://earthstar.space/viewer/" />
  <meta name="theme-color" content="#05070d" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <!-- Open Graph / Twitter card. og.jpg is a deck-view frame, 1200×630. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Earth Star" />
  <meta property="og:url" content="https://earthstar.space/viewer/" />
  <meta property="og:title" content="Earth Star Viewer — live space weather" />
  <meta property="og:description" content="Earth's space-weather environment in one live view: solar wind, the modelled shield, aurora and the Sun in six instruments — every value with its source, timestamp and evidence tier." />
  <meta property="og:image" content="https://earthstar.space/viewer/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="The deck view: Earth from the tree-ship's rail, the Sun beyond, and the space-weather instruments alongside." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Earth Star Viewer — live space weather" />
  <meta name="twitter:description" content="Earth's space-weather environment in one live view: solar wind, the modelled shield, aurora and the Sun, every value with its source, timestamp and evidence tier." />
  <meta name="twitter:image" content="https://earthstar.space/viewer/og.jpg" />

  <link rel="preconnect" href="https://services.swpc.noaa.gov" crossorigin />
  <script type="module" crossorigin src="/viewer/assets/index-ejD8EtbY.js"></script>
  <link rel="stylesheet" crossorigin href="/viewer/assets/index-DLjP8RY0.css">
</head>
<body>
  <a class="skip-link" href="#margin-body">Skip to the Situation Report</a>
  <canvas id="scene" aria-hidden="true"></canvas>

  <div class="shell">
    <header class="top">
      <!-- The timestamp sits under the wordmark: stacking it costs the header
           row no width, which is what the notice beside it needed. -->
      <div class="brand-block">
        <h1 class="brand">
          <a class="mark" href="https://earthstar.space/" title="Earth Star">
            <img src="logo.webp" width="480" height="196" alt="Earth Star" decoding="async">
          </a>
          <span class="brand-word">Viewer</span>
        </h1>
        <p class="clock" id="clock" role="status"></p>
      </div>

      <!-- The most consequential NOAA notice in force, in the space the header
           was wasting; a click opens every notice verbatim. Hidden when none is
           in force, and never an "all clear". -->
      <a class="headline-alert" id="headline-alert" href="#margin-body" hidden></a>

      <button class="ctl controls-toggle" id="controls-toggle" type="button"
        aria-expanded="false" aria-controls="controls">Controls</button>

      <nav class="controls" id="controls" aria-label="View and layer controls">
        <span class="ctl-set">
          <span class="ctl-legend" id="lg-scale">Scale</span>
          <span class="ctl-group" role="group" aria-labelledby="lg-scale">
            <button class="ctl" id="scale-globe" aria-pressed="true"
              title="Distances log-compressed and bodies enlarged, so the whole system is legible">Globe</button>
            <button class="ctl" id="scale-true" aria-pressed="false"
              title="Distances and sizes to scale — honest, and mostly empty">True</button>
          </span>
        </span>

        <span class="ctl-set">
          <span class="ctl-legend" id="lg-view">View</span>
          <span class="ctl-group" id="view-group" role="group" aria-labelledby="lg-view"></span>
        </span>

        <span class="ctl-set">
          <span class="ctl-legend" id="lg-layers">Layers</span>
          <span class="ctl-group ctl-toggles" role="group" aria-labelledby="lg-layers">
            <button class="ctl" id="shield-toggle" aria-pressed="true"
              title="IGRF-14 field lines and the modelled magnetopause">Field</button>
            <button class="ctl" id="aurora-toggle" aria-pressed="true"
              title="OVATION Prime aurora probability on the globe">Aurora</button>
            <button class="ctl" id="wind-toggle" aria-pressed="true"
              title="Solar wind stream, speed and density from the measured wind">Wind</button>
            <button class="ctl" id="cme-toggle" aria-pressed="true"
              title="Analysed CME cones propagating from the Sun">CMEs</button>
            <button class="ctl" id="coast-toggle" aria-pressed="false"
              title="Natural Earth vector coastlines and graticule, drawn over the surface imagery">Coast</button>
            <button class="ctl" id="motion-toggle" aria-pressed="false"
              title="Freeze all animation; the spatial information stays">Motion</button>
          </span>
        </span>
      </nav>

    </header>

    <main class="stage">
      <!-- The instrument tiles live in a rail at the left edge of the scene,
           not stacked across its top: thirteen readings are a column of
           marginal notes beside the planet, and a grid across the sky was
           both the clutter and — on a phone — most of a screen. The rail
           collapses to its chevron and remembers the choice. -->
      <div class="rail" id="rail">
        <div class="rail-head">
          <span class="rail-legend">Instruments</span>
          <button class="rail-toggle" id="rail-toggle" type="button"
            aria-expanded="true" aria-controls="instruments"
            aria-label="Hide instrument tiles"
            title="Show or hide the instrument tiles (t)">
            <span class="rail-chevron" aria-hidden="true">‹</span>
          </button>
        </div>
        <div id="instruments" class="instruments"></div>
      </div>
      <div id="ticker" class="ticker"></div>
      <!-- Notes on the stage itself, top right: which scale is drawn and what
           it distorts, with the other scale one click away (README rule 6),
           and — only while it is true — that the Sun is the unobserved
           placeholder because solar imagery is unavailable. Both are written
           by main.ts; the scale note stays hidden until there is a scene for
           it to describe. -->
      <div class="stage-notes" id="stage-notes">
        <p class="scale-note" id="scale-note" hidden><span id="scale-note-text"></span>
          <button type="button" class="scale-flip" id="scale-flip"></button></p>
        <p class="stage-note" id="stage-note" hidden></p>
      </div>
      <div id="tip" class="tip" role="status" hidden></div>
    </main>

    <aside class="margin" aria-label="Detail panel">
      <nav class="tabs" id="tabs" role="tablist" aria-label="Detail sections"></nav>
      <!-- tabindex="0", not -1: this region scrolls, and a keyboard user needs
           to be able to reach it to scroll it. The skip link lands here too. -->
      <div class="margin-body" id="margin-body" role="tabpanel" tabindex="0"
           aria-labelledby="tab-report"></div>
      <!-- The foot is one row: the status line, then the actions beside it.
           On a phone the status moves up under the tabs instead. The chip is
           the render scale, shown only while the renderer is trading
           resolution for frame rate; its sentence is in its title and the
           Sources tab. -->
      <p class="status" id="status" role="status"></p>
      <div class="margin-actions">
        <span class="perf-chip" id="perf" hidden></span>
        <button class="ctl ctl-sm" id="brief-copy" type="button"
                title="Copy the whole panel as Markdown, with every timestamp and source">Copy briefing</button>
        <button class="ctl ctl-sm" id="brief-download" type="button"
                title="Download the briefing as a Markdown file">.md</button>
      </div>
    </aside>
  </div>

  <p class="sr-only" id="announce" role="status" aria-live="polite"></p>
</body>
</html>
