<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>The Viewer — Earth Star</title>
  <meta name="description" content="A live, honestly-labeled 3D view of Earth's space-weather environment: solar wind, geomagnetic activity and solar X-rays from NOAA SWPC, with every value carrying its source, timestamp and evidence tier." />
  <link rel="preconnect" href="https://services.swpc.noaa.gov" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/viewer/assets/main-C9QiOtFL.js"></script>
  <link rel="modulepreload" crossorigin href="/viewer/assets/direct-source-BVzYCDyr.js">
  <link rel="stylesheet" crossorigin href="/viewer/assets/direct-source-DQ94914h.css">
</head>
<body>
  <a class="skip-link" href="#report-h">Skip to the Situation Report</a>
  <canvas id="scene" aria-hidden="true"></canvas>

  <div class="shell">
    <header class="top">
      <h1 class="brand">The Viewer<small>Earth Star · space weather, honestly labeled</small></h1>
      <nav class="controls" aria-label="View controls">
        <button class="ctl" id="view-deck" aria-pressed="true">Deck view</button>
        <button class="ctl" id="view-shield" aria-pressed="false">Magnetosphere</button>
        <button class="ctl" id="view-orbit" aria-pressed="false">Orbit</button>
        <button class="ctl" id="scale-toggle" aria-pressed="false">
          <span id="scale-label">Globe scale</span>
        </button>
        <button class="ctl" id="shield-toggle" aria-pressed="true">Shield</button>
        <button class="ctl" id="aurora-toggle" aria-pressed="true">Aurora</button>
        <button class="ctl" id="motion-toggle" aria-pressed="false">Reduced motion</button>
        <a class="ctl" href="verify.html">Verify</a>
      </nav>
    </header>

    <div id="hud-top"></div>

    <div id="hud-bottom"></div>
  </div>

  <p class="sr-only" id="scale-announce" role="status"></p>
</body>
</html>
