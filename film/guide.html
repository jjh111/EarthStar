<!doctype html><meta charset="utf-8">
<title>Gomenata — the field guide</title>
<style>
@font-face { font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 300 700; src: url(../assets/fonts/CormorantGaramond.woff2) format('woff2'); }
@font-face { font-family: 'Cormorant Garamond'; font-style: italic; font-weight: 300 700; src: url(../assets/fonts/CormorantGaramond-italic.woff2) format('woff2'); }
html, body { margin: 0; background: #1a120c; }
canvas { display: block; width: 1920px; height: 1080px; }
</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
// Gomenata, the field guide, as a film: a book on a desk, its pages turning,
// each plate drawing itself the way the guide was made: pencil construction,
// then the pen, then the wash blooming in, the key, the loupe, the tag.
// render(t) draws the frame at time t, deterministically.
import { ORDER, PLATE, STEP, TL } from './guide-timeline.mjs';

const W = 1920, H = 1080, c = document.getElementById('c'), ctx = c.getContext('2d');
const PWb = 840, PHb = 1080;                // a page, in book units; the spine is x = 0
const PAPER = '#efe4c8', INK = '#2a1d12', SEPIA = '#6b4a2e', OX = '#8a2c1c', VERD = '#3d6e60', GOLD = '#c99a2e';
const SERIF = '"Cormorant Garamond", "FreeSerif", serif', MONO = '"Courier New", "DejaVu Sans Mono", monospace';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eo = (x) => 1 - Math.pow(1 - x, 3);
const back = (x) => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);
const lerp = (a, b, x) => a + (b - a) * x;
function hash(a, b = 0) { let h = Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

// ── assets ──
const G = '../field-guide/';
let TAX, META = {}, IMG = {}, ALPHA = {};
// a plate not drawn yet loads as nothing, and its page is left blank
const img = (src) => new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => { console.log('missing', src); ok(null); }; i.src = src; });
// an SVG is given the size its viewBox names, so it keeps its shape when drawn
const svg = async (src) => {
  const txt = await (await fetch(src)).text(), vb = txt.match(/viewBox="([\d.\s-]+)"/)[1].trim().split(/\s+/).map(Number);
  return img(URL.createObjectURL(new Blob([txt.replace('<svg ', `<svg width="${vb[2]}" height="${vb[3]}" `)], { type: 'image/svg+xml' })));
};
async function load() {
  TAX = await (await fetch(G + 'taxonomy.json')).json();
  const jobs = [];
  for (const id of ORDER) {
    jobs.push(fetch(`${G}plates/${id}.json`).then((r) => r.json()).then((m) => (META[id] = m), () => {}));
    for (const k of ['wash', 'lines', 'inset']) jobs.push(img(`${G}plates/${id}-${k}.webp`).then((i) => (IMG[`${id}-${k}`] = i)));
    jobs.push(img(`${G}plates/${id}.webp`).then((i) => (IMG[id] = i)));
  }
  for (const o of TAX.orders) jobs.push(svg(`${G}figures/${o.id}.svg`).then((i) => (IMG[o.id] = i)));
  jobs.push(svg(`${G}figures/cladogram.svg`).then((i) => (IMG.clado = i)));
  jobs.push(svg(`${G}figures/returns.svg`).then((i) => (IMG.returns = i)));
  jobs.push(img('../Assets/EarthStar Logo JH 2025 w.png').then((i) => (IMG.logo = i)));
  jobs.push(img('../assets/img/glyphs/star.svg').then((i) => (IMG.star = i)));
  await Promise.all(jobs);
  for (const id of ORDER) if (IMG[`${id}-wash`]) {
    const cv = document.createElement('canvas'); cv.width = 140; cv.height = 100; const x = cv.getContext('2d');
    x.drawImage(IMG[`${id}-wash`], 0, 0, 140, 100); ALPHA[id] = x.getImageData(0, 0, 140, 100).data;
  }
  await Promise.all([`400 40px ${SERIF}`, `italic 400 40px ${SERIF}`, `600 40px ${SERIF}`].map((f) => document.fonts.load(f)));
  textures();
  LANES = lanes();
}

// ── textures, made once ──
let PAPERTEX, WOOD, CLOTH, MARBLE, SHEET;
const vn = (x, y) => {
  const xi = Math.floor(x), yi = Math.floor(y), u = x - xi, v = y - yi, s = (q) => q * q * (3 - 2 * q);
  return lerp(lerp(hash(xi, yi), hash(xi + 1, yi), s(u)), lerp(hash(xi, yi + 1), hash(xi + 1, yi + 1), s(u)), s(v));
};
function noiseCanvas(w, h, fn) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const x = cv.getContext('2d'), d = x.createImageData(w, h);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) { const [r, g, b, a] = fn(i, j); const k = (j * w + i) * 4; d.data[k] = r; d.data[k + 1] = g; d.data[k + 2] = b; d.data[k + 3] = a; }
  x.putImageData(d, 0, 0);
  return cv;
}
function textures() {
  PAPERTEX = noiseCanvas(512, 512, (i, j) => { const n = hash(i, j) * 0.6 + hash(i >> 2, j >> 2) * 0.4; return [120, 90, 50, Math.round(26 * n)]; });
  WOOD = noiseCanvas(2400, 1400, (i, j) => {
    const pk = Math.floor((j + 37) / 290), pj = (j + 37) % 290, x = i + hash(pk, 7) * 1500;
    const warp = 34 * vn(x / 520, j / 120 + pk * 3) + 9 * vn(x / 90, j / 40);
    const line = Math.pow(Math.abs(Math.sin((j + warp) / 9 + pk * 1.7)), 14);
    const streak = vn(x / 300, j / 2.4 + pk * 50) * 0.6 + vn(x / 60, j / 1.2 + pk * 9) * 0.4;
    const v = (0.68 + 0.16 * hash(pk, 3) + 0.26 * (streak - 0.5) - 0.12 * line + 0.05 * (hash(i, j) - 0.5)) * (pj < 2 ? 0.4 : pj < 4 ? 0.75 : 1);
    return [Math.round(84 * v), Math.round(53 * v), Math.round(31 * v), 255];
  });
  SHEET = noiseCanvas(512, 512, (i, j) => { const n = hash(i, j) * 0.5 + vn(i / 9, j / 9) * 0.5; return [150, 130, 100, Math.round(20 * n)]; });
  CLOTH = noiseCanvas(256, 256, (i, j) => { const w = ((i + j) % 4 < 2 ? 1 : 0.92) * (0.9 + 0.2 * hash(i, j)); return [Math.round(30 * w), Math.round(58 * w), Math.round(42 * w), 255]; });
  // combed marbling for the endpapers
  const pal = [[42, 62, 54], [168, 140, 92], [104, 50, 38], [214, 200, 170], [58, 74, 92], [140, 116, 74], [42, 62, 54], [214, 200, 170]];
  MARBLE = noiseCanvas(840, 1080, (i, j) => {
    const comb = 6 * Math.sin(i / 9), u = i + 160 * (vn(i / 160, j / 180) - 0.5) + 30 * Math.sin(j / 53 + i / 90);
    const v = (j + comb + 70 * Math.sin(u / 71) + 40 * vn(i / 70, j / 70)) / 24;
    const p = pal[((Math.floor(v) % pal.length) + pal.length) % pal.length], f = 0.8 + 0.22 * (v - Math.floor(v)) + 0.06 * hash(i, j);
    return [Math.min(255, p[0] * f), Math.min(255, p[1] * f), Math.min(255, p[2] * f), 255];
  });
}

// ── the camera over the book ──
const CAM = (() => {
  const k = [[0, 0.8, 420, 0], [5.6, 0.86, 420, 0], [6.9, 0.92, 210, 0], [11.0, 0.96, 250, 0], [12.4, 0.9, 0, 0], [19.6, 0.93, 0, 0], [20.8, 0.9, 0, 0], [22.4, 1.22, 0, 70], [26.6, 1.28, 0, 80]];
  TL.plates.forEach(([p0, p1], i) => { k.push([p0 + 0.6, 0.935, i % 2 ? 14 : -14, 0], [p1 - 0.2, 0.965, i % 2 ? 34 : 6, 4]); });
  k.push([TL.returns[0] + 0.7, 0.9, 0, 0], [TL.returns[1], 0.93, 0, 0], [TL.close[0] + 1.6, 0.72, 0, 150], [TL.end, 0.75, 0, 150]);
  return k;
})();
function camAt(t) {
  let i = 0; while (i < CAM.length - 2 && t > CAM[i + 1][0]) i++;
  const a = CAM[i], b = CAM[i + 1], u = ease(ramp(t, a[0], b[0]));
  return { s: lerp(a[1], b[1], u), x: lerp(a[2], b[2], u), y: lerp(a[3], b[3], u) };
}
let CAMNOW;
function bookSpace() { const k = CAMNOW; ctx.setTransform(k.s, 0, 0, k.s, W / 2 - k.x * k.s, H / 2 - k.y * k.s); }

// ── type ──
function font(size, { italic = false, weight = 400, mono = false } = {}) { return `${italic ? 'italic ' : ''}${weight} ${size}px ${mono ? MONO : SERIF}`; }
function write(str, x, y, size, p, { italic = false, weight = 400, color = INK, align = 'left', caps = false, track = 0, mono = false } = {}) {
  if (p <= 0) return;
  ctx.save();
  ctx.font = font(size, { italic, weight, mono });
  ctx.letterSpacing = `${track}px`;
  const s = caps ? str.toUpperCase() : str;
  const w = ctx.measureText(s).width;
  const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  if (p < 1) { ctx.beginPath(); ctx.rect(x0 - 4, y - size * 1.1, (w + 8) * p, size * 1.6); ctx.clip(); }
  ctx.fillStyle = color; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  ctx.fillText(s, x0, y);
  ctx.restore();
  return w;
}
function wrap(str, size, maxW, opts = {}) {
  ctx.save(); ctx.font = font(size, opts); ctx.letterSpacing = '0px';
  const out = []; let line = '';
  for (const w of str.split(' ')) { const tr = line ? line + ' ' + w : w; if (ctx.measureText(tr).width > maxW && line) { out.push(line); line = w; } else line = tr; }
  if (line) out.push(line);
  ctx.restore(); return out;
}
function para(str, x, y, size, maxW, p, opts = {}, lh = 1.32) {
  const lines = wrap(str, size, maxW, opts);
  lines.forEach((l, i) => write(l, x, y + i * size * lh, size, clamp(p * lines.length - i), opts));
  return lines.length * size * lh;
}
const UNITS = [['km', 1e3], ['m', 1], ['cm', 1e-2], ['mm', 1e-3], ['µm', 1e-6], ['nm', 1e-9]];
function niceBar(label, px, lo = 110, hi = 320) {
  if (px >= lo && px <= hi) return [label, px];
  const [, num, unit] = label.match(/([\d.]+)\s*(\S+)/), perM = px / (+num * UNITS.find((u) => u[0] === unit)[1]);
  let best = null;
  for (let e = -10; e <= 4; e++) for (const k of [1, 2, 5]) {
    const L = k * 10 ** e, p = L * perM;
    if (p >= lo && p <= hi && (!best || Math.abs(p - 200) < Math.abs(best[1] - 200))) best = [L, p];
  }
  if (!best) return [label, px];
  const [u, f] = UNITS.find(([, f]) => best[0] / f >= 0.999);
  return [`${+(best[0] / f).toPrecision(3)} ${u}`, best[1]];
}
const firstSentence = (s) => (s.match(/^.*?[.!?](\s|$)/) || [s])[0].trim();

// ── the desk, the light, the dust ──
function desk(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const k = CAMNOW, z = 0.85 + 0.15 * k.s;
  ctx.save(); ctx.translate(W / 2 - k.x * 0.25, H / 2 - k.y * 0.25); ctx.scale(z, z); ctx.drawImage(WOOD, -1200, -700); ctx.restore();
  const g = ctx.createRadialGradient(W * 0.38, H * 0.3, 80, W * 0.5, H * 0.55, W * 0.85);
  g.addColorStop(0, 'rgba(255,214,150,0.22)'); g.addColorStop(0.5, 'rgba(0,0,0,0.1)'); g.addColorStop(1, 'rgba(0,0,0,0.62)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function props() {
  bookSpace();
  // a pencil, and a brass loupe, left where they were put down
  ctx.save(); ctx.translate(980, 360); ctx.rotate(-0.42);
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(8, 10, 520, 26);
  ctx.fillStyle = '#c99a3a'; ctx.fillRect(0, 0, 440, 24); ctx.fillStyle = '#d9b05a'; ctx.fillRect(0, 2, 440, 7);
  ctx.fillStyle = '#9a8f80'; ctx.fillRect(440, 0, 30, 24);
  ctx.fillStyle = '#e6c9a0'; ctx.beginPath(); ctx.moveTo(470, 0); ctx.lineTo(530, 12); ctx.lineTo(470, 24); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3a3330'; ctx.beginPath(); ctx.moveTo(515, 9); ctx.lineTo(530, 12); ctx.lineTo(515, 15); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.translate(-1050, 330);
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(14, 18, 112, 112, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#b8892e'; ctx.lineWidth = 18; ctx.beginPath(); ctx.arc(0, 0, 100, 0, 7); ctx.stroke();
  ctx.strokeStyle = '#e8c574'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(-3, -3, 104, 3.6, 5.4); ctx.stroke();
  const gl = ctx.createRadialGradient(-30, -30, 10, 0, 0, 100); gl.addColorStop(0, 'rgba(255,255,255,0.25)'); gl.addColorStop(1, 'rgba(255,255,255,0.03)');
  ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, 92, 0, 7); ctx.fill();
  ctx.fillStyle = '#5a3a22'; ctx.save(); ctx.rotate(0.8); ctx.fillRect(108, -14, 150, 28); ctx.restore();
  ctx.restore();
}
function motes(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const beam = ctx.createLinearGradient(0, 0, W * 0.6, H);
  beam.addColorStop(0, 'rgba(255,225,170,0.10)'); beam.addColorStop(0.5, 'rgba(255,225,170,0.04)'); beam.addColorStop(1, 'rgba(255,225,170,0)');
  ctx.fillStyle = beam; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W * 0.5, 0); ctx.lineTo(W * 0.85, H); ctx.lineTo(W * 0.25, H); ctx.closePath(); ctx.fill();
  for (let k = 0; k < 40; k++) {
    const x = ((hash(k, 1) * W * 0.7 + t * (6 + 10 * hash(k, 2))) % (W * 0.7)) + W * 0.1, y = (hash(k, 3) * H + Math.sin(t * 0.3 + k) * 30 + t * 4) % H;
    ctx.fillStyle = `rgba(255,235,200,${(0.12 + 0.2 * hash(k, 4)) * (0.6 + 0.4 * Math.sin(t * 1.3 + k))})`;
    ctx.beginPath(); ctx.arc(x, y, 1 + 2 * hash(k, 5), 0, 7); ctx.fill();
  }
}

// ── paper and pages ──
function paper(x, y, w, h, side) {
  ctx.fillStyle = PAPER; ctx.fillRect(x, y, w, h);
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  for (let j = y; j < y + h; j += 512) for (let i = x; i < x + w; i += 512) ctx.drawImage(PAPERTEX, i, j);
  if (side) {
    const gx = side === 'L' ? x + w : x, g = ctx.createLinearGradient(gx, 0, side === 'L' ? gx - 120 : gx + 120, 0);
    g.addColorStop(0, 'rgba(90,60,30,0.32)'); g.addColorStop(1, 'rgba(90,60,30,0)');
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  }
  const v = ctx.createRadialGradient(x + w / 2, y + h / 2, h * 0.35, x + w / 2, y + h / 2, h * 0.8);
  v.addColorStop(0, 'rgba(120,80,40,0)'); v.addColorStop(1, 'rgba(120,80,40,0.16)');
  ctx.fillStyle = v; ctx.fillRect(x, y, w, h);
  ctx.restore();
}
function pageAt(side, fn, t) {
  bookSpace();
  const x = side === 'L' ? -PWb : 0;
  ctx.save(); ctx.translate(x, -PHb / 2);
  paper(0, 0, PWb, PHb, side);
  ctx.beginPath(); ctx.rect(0, 0, PWb, PHb); ctx.clip();
  if (fn) fn(t);
  ctx.restore();
}
// the boards and the edge of the page block, under one side or both
function bookBlock(both) {
  bookSpace();
  const x0 = both ? -PWb - 16 : -4, w = (both ? 2 * PWb : PWb) + 20;
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.beginPath(); ctx.roundRect(x0 + 10, -PHb / 2 + 6, w + 24, PHb + 40, 14); ctx.fill();
  ctx.fillStyle = ctx.createPattern(CLOTH, 'repeat'); ctx.beginPath(); ctx.roundRect(x0, -PHb / 2 - 14, w, PHb + 28, 10); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.fill();
  ctx.fillStyle = '#d8cba8'; ctx.fillRect(both ? -PWb - 6 : -2, -PHb / 2 + 2, both ? 2 * PWb + 12 : PWb + 8, PHb + 6);
}
// a leaf turning from right to left: front shows `front`, back shows `backFn`
function leaf(u, front, backFn, tf, tb) {
  bookSpace();
  const cos = Math.cos(Math.PI * u), wpx = PWb * Math.abs(cos), lift = Math.sin(Math.PI * u);
  if (wpx < 1) return;
  ctx.save();
  // the shadow it throws
  ctx.fillStyle = `rgba(0,0,0,${0.22 * lift})`;
  ctx.beginPath(); ctx.rect(cos > 0 ? 0 : -wpx - 40 * lift, -PHb / 2, wpx + 40 * lift, PHb); ctx.fill();
  ctx.translate(cos > 0 ? 0 : -wpx, -PHb / 2 - 18 * lift);
  ctx.scale(Math.abs(cos), 1 + 0.034 * lift);
  paper(0, 0, PWb, PHb, cos > 0 ? 'R' : 'L');
  ctx.beginPath(); ctx.rect(0, 0, PWb, PHb); ctx.clip();
  if (cos > 0) { if (front) front(tf); } else if (backFn) backFn(tb);
  const g = ctx.createLinearGradient(0, 0, PWb, 0);
  const dark = 0.35 * (1 - Math.abs(cos));
  if (cos > 0) { g.addColorStop(0, `rgba(40,25,10,${dark * 0.6})`); g.addColorStop(1, `rgba(40,25,10,${dark})`); } else { g.addColorStop(0, `rgba(40,25,10,${dark})`); g.addColorStop(1, `rgba(40,25,10,${dark * 0.6})`); }
  ctx.fillStyle = g; ctx.fillRect(0, 0, PWb, PHb);
  ctx.restore();
}

// ── the cover ──
// the closed book, its left edge at x0; sx squeezes it about the spine as it swings
function cover(t, x0 = 0, sx = 1) {
  bookSpace();
  ctx.save(); ctx.scale(sx, 1); ctx.translate(x0, -PHb / 2);
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.roundRect(-4, 22, PWb + 30, PHb + 10, 14); ctx.fill();
  const pat = ctx.createPattern(CLOTH, 'repeat'); ctx.fillStyle = pat; ctx.beginPath(); ctx.roundRect(0, 0, PWb, PHb, 10); ctx.fill();
  const sh = ctx.createLinearGradient(0, 0, PWb, PHb); sh.addColorStop(0, 'rgba(255,255,255,0.06)'); sh.addColorStop(1, 'rgba(0,0,0,0.3)');
  ctx.fillStyle = sh; ctx.fill();
  coverStamp(t);
  ctx.restore();
}
function coverStamp(t) {
  const sweep = ((t * 0.18) % 1.6) - 0.3;
  const gold = ctx.createLinearGradient(0, 0, PWb, PHb * 0.6);
  gold.addColorStop(0, '#b08636'); gold.addColorStop(clamp(sweep - 0.1), '#c99f4a'); gold.addColorStop(clamp(sweep), '#f8e2a0'); gold.addColorStop(clamp(sweep + 0.1), '#c99f4a'); gold.addColorStop(1, '#a87e30');
  ctx.strokeStyle = gold; ctx.lineWidth = 3; ctx.strokeRect(46, 46, PWb - 92, PHb - 92); ctx.lineWidth = 1.2; ctx.strokeRect(60, 60, PWb - 120, PHb - 120);
  const st = 120; ctx.save(); ctx.globalAlpha = 0.95; ctx.drawImage(tinted(IMG.star, '#e2bd62', st), PWb / 2 - st / 2, 210); ctx.restore();
  for (const [str, y, size, track, italic] of [['GOMENATA', 520, 96, 22, false], ['A FIELD GUIDE TO THE ADJACENT LIFE', 604, 30, 6, false], ['with fifteen plates', 660, 34, 0, true], ['EARTH STAR', PHb - 130, 28, 10, false]]) {
    ctx.save(); ctx.font = font(size, { italic }); ctx.letterSpacing = `${track}px`; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillText(str, PWb / 2 + 2, y + 2);
    ctx.fillStyle = gold; ctx.fillText(str, PWb / 2, y); ctx.restore();
  }
}

// ── page contents ──
function marbled() { ctx.drawImage(MARBLE, 0, 0, PWb, PHb); ctx.strokeStyle = 'rgba(40,25,10,0.4)'; ctx.lineWidth = 2; ctx.strokeRect(24, 24, PWb - 48, PHb - 48); }
function titlePage(t) {
  write('EARTH STAR · FIELD NOTES', PWb / 2, 120, 22, ramp(t, 0.2, 1.0), { align: 'center', track: 5, color: SEPIA });
  write('GOMENATA', PWb / 2, 250, 104, ramp(t, 0.5, 1.6), { align: 'center', track: 18 });
  write('A Field Guide to the Adjacent Life', PWb / 2, 320, 40, ramp(t, 1.2, 2.2), { align: 'center', italic: true });
  drawSpecimen('snowmakers', { x: 170, y: 360, w: 500, h: 440 }, t - 1.4, { marks: false, loupe: false, tag: false, swatches: false, scale: false });
  para(TAX.imprint, 110, 830, 24, PWb - 220, ramp(t, 3.4, 4.6), { italic: true, color: SEPIA });
  write('Described and drawn by Claude for Earth Star, 2026', PWb / 2, 990, 20, ramp(t, 4.2, 4.9), { align: 'center', color: '#8a7458' });
}
function prefaceLeft(t) {
  write('PREFACE', 80, 110, 24, ramp(t, 0.3, 0.9), { track: 6, color: OX });
  write('the domain GOMENATA, the adjacent life', 80, 160, 30, ramp(t, 0.6, 1.5), { italic: true, color: SEPIA });
  const h = para(TAX.domain.definition, 80, 240, 29, PWb - 160, ramp(t, 1.0, 5.8));
  para(TAX.domain.etymology, 80, 280 + h, 26, PWb - 160, ramp(t, 5.6, 7.4), { italic: true, color: SEPIA });
