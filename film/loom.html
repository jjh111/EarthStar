<!doctype html><meta charset="utf-8">
<title>Earth Star — the loom</title>
<style>
@font-face { font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 300 700; src: url(../assets/fonts/CormorantGaramond.woff2) format('woff2'); }
@font-face { font-family: 'Cormorant Garamond'; font-style: italic; font-weight: 300 700; src: url(../assets/fonts/CormorantGaramond-italic.woff2) format('woff2'); }
@font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 300 700; src: url(../assets/fonts/DMSans.woff2) format('woff2'); }
html, body { margin: 0; background: #08130d; }
canvas { display: block; width: 1920px; height: 1080px; }
</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Earth Star — the loom. A tapestry woven from garbage: every tile starts as
// something thrown away, drifts in from the heap on the right, and is woven
// in at the front. Which tone each tile takes is a cellular automaton run
// along the timeline, one column per step; at each era the story forces a
// figure into the weave and the rule carries its echo forward.
// render(t) draws the frame at time t (seconds), deterministically.
const W = 1920, H = 1080, ROWS = 32, NCOLS = 330, CELL = 24, TOP0 = 150, DUR = 48;
const c = document.getElementById('c'), ctx = c.getContext('2d');
const SERIF = '"Cormorant Garamond", "FreeSerif", serif', SANS = '"DM Sans", "FreeSans", sans-serif';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const win = (t, a, b, fi = 0.8, fo = 0.8) => Math.min(ease(ramp(t, a, a + fi)), 1 - ease(ramp(t, b - fo, b)));
const lerp = (a, b, x) => a + (b - a) * x;
const sstep = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
function hash(a, b, s = 0) {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296;
}
const rgb = (c, k = 1, a = 1) => `rgba(${clamp(c[0] * k, 0, 255) | 0},${clamp(c[1] * k, 0, 255) | 0},${clamp(c[2] * k, 0, 255) | 0},${a})`;
const mix = (p, q, x) => [lerp(p[0], q[0], x), lerp(p[1], q[1], x), lerp(p[2], q[2], x)];

// ── the eras: each quotes an old craft, and each has its own rule ──
const ERAS = [
  { key: 'heap', start: 0, rule: 30, year: 'YEAR 0', name: 'the heap', style: 'rubbish',
    ground: [[58, 58, 54], [77, 74, 68], [43, 46, 44], [70, 62, 52]], pattern: [[127, 160, 184], [201, 194, 176], [176, 82, 58], [109, 138, 74], [216, 176, 74], [90, 120, 160]] },
  { key: 'mosaic', start: 40, rule: 90, fig: 'clearers', cf: 60, year: 'YEAR 1', name: 'The Clearers · body', style: 'Byzantine mosaic',
    ground: [[28, 47, 90], [34, 56, 106], [24, 40, 80], [30, 52, 98]], pattern: [[217, 165, 33], [240, 201, 74]], ink: [236, 226, 200], gold: [246, 196, 52], wash: [70, 140, 130] },
  { key: 'wool', start: 86, rule: 150, fig: 'shorewalkers', cf: 110, year: 'YEAR 7', name: 'The Shore-walkers · biome', style: 'woven wool',
    ground: [[42, 61, 102], [36, 54, 92], [48, 68, 108]], pattern: [[201, 143, 59], [184, 128, 52]], ink: [242, 230, 200], gold: [178, 58, 44], wash: [84, 150, 132] },
  { key: 'glass', start: 136, rule: 18, fig: 'circle', cf: 160, year: 'YEAR 49', name: 'The Circle · being', style: 'stained glass',
    ground: [[122, 24, 40], [62, 30, 96], [100, 22, 58], [40, 44, 120]], pattern: [[236, 163, 58], [224, 124, 44]], ink: [250, 242, 218], gold: [255, 206, 70], wash: [236, 120, 140] },
  { key: 'faience', start: 186, rule: 110, fig: 'weavers', cf: 210, year: 'YEAR 343', name: 'The Weavers · network', style: 'faience & limestone',
    ground: [[205, 184, 143], [214, 195, 155], [196, 174, 132]], pattern: [[47, 156, 149], [36, 132, 130]], ink: [26, 40, 72], gold: [186, 74, 46], wash: [40, 70, 130] },
  { key: 'paint', start: 236, rule: 105, fig: 'gleaners', cf: 260, year: 'YEAR 2401', name: 'The Gleaners · star', style: 'the painting',
    ground: [[30, 50, 40]], pattern: [[233, 185, 44]], ink: [244, 234, 206], gold: [255, 208, 72], wash: [140, 200, 220] },
  { key: 'dream', start: 286, rule: 45, fig: 'star', cf: 304, year: 'YEAR ∞', name: 'the dream', style: 'light',
    ground: [[30, 66, 50], [24, 52, 44]], pattern: [[233, 185, 44], [134, 201, 122]], ink: [240, 230, 200], gold: [255, 222, 120], wash: [134, 201, 122] },
];
const eraOfCol = (col) => { let e = 0; for (let i = 0; i < ERAS.length; i++) if (col >= ERAS[i].start) e = i; return e; };

// ── assets ──
const SRC = { bg: '../Assets/0-BG.png', earth: '../Assets/1-earth.png', sun: '../Assets/2-sun.png', ship: '../Assets/3-islandship.png', glim: '../Assets/4-glimmer.png',
  logo: '../Assets/EarthStar Logo JH 2025 w.png', 'star-ink': '../assets/img/glyphs/star.svg' };
for (const g of ['clearers', 'shorewalkers', 'circle', 'weavers', 'gleaners']) for (const l of ['wash', 'ink', 'gold']) SRC[`${g}-${l}`] = `../assets/img/gomens/${g}-${l}.svg`;
const IMG = {};
async function load() {
  await Promise.all(Object.entries(SRC).map(([k, src]) => new Promise((ok, no) => {
    const i = new Image(); i.onload = () => { IMG[k] = i; ok(); }; i.onerror = () => no(new Error(src)); i.src = src;
  })));
  await Promise.all([`400 40px "Cormorant Garamond"`, `italic 400 40px "Cormorant Garamond"`, `500 20px "DM Sans"`].map((f) => document.fonts.load(f)));
}

// coverage of a layer, sampled onto an n×n block of cells
function coverage(img, n, sub = 4) {
  const o = document.createElement('canvas'); o.width = o.height = n * sub;
  const x = o.getContext('2d', { willReadFrequently: true });
  x.drawImage(img, 0, 0, o.width, o.height);
  const d = x.getImageData(0, 0, o.width, o.height).data, out = new Float32Array(n * n);
  for (let r = 0; r < n; r++) for (let q = 0; q < n; q++) {
    let s = 0;
    for (let v = 0; v < sub; v++) for (let u = 0; u < sub; u++) s += d[((r * sub + v) * o.width + q * sub + u) * 4 + 3];
    out[r * n + q] = s / (sub * sub * 255);
  }
  return out;
}

// ── the weave: state, tone, era and colour per cell, computed once ──
// tone: 0 ground, 1 pattern, 2 figure-ink, 3 figure-gold, 4 figure-wash
const FIG = 26, FIG_TOP = 3;
let TONE, ERA, COLR, HCOL;
function weave() {
  TONE = new Uint8Array(NCOLS * ROWS); ERA = new Uint8Array(NCOLS * ROWS); COLR = new Array(NCOLS * ROWS); HCOL = new Array(NCOLS * ROWS);
  const masks = {};
  for (const e of ERAS) if (e.fig) {
    masks[e.fig] = e.fig === 'star'
      ? { ink: coverage(IMG['star-ink'], FIG) }
      : { ink: coverage(IMG[`${e.fig}-ink`], FIG), gold: coverage(IMG[`${e.fig}-gold`], FIG), wash: coverage(IMG[`${e.fig}-wash`], FIG) };
  }
  // the painting, sampled onto the Gleaners' panel
  const pe = ERAS[5], pw = ERAS[6].start - pe.start;
  const po = document.createElement('canvas'); po.width = pw * 3; po.height = ROWS * 3;
  const px = po.getContext('2d', { willReadFrequently: true });
  for (const k of ['bg', 'earth', 'sun', 'ship', 'glim']) {
    const im = IMG[k], s = Math.max(po.width / im.width, po.height / im.height);
    px.drawImage(im, (po.width - im.width * s) / 2, (po.height - im.height * s) / 2, im.width * s, im.height * s);
  }
  const pd = px.getImageData(0, 0, po.width, po.height).data;
  const paintAt = (q, r) => { let a = [0, 0, 0]; for (let v = 0; v < 3; v++) for (let u = 0; u < 3; u++) { const i = ((r * 3 + v) * po.width + q * 3 + u) * 4; a[0] += pd[i]; a[1] += pd[i + 1]; a[2] += pd[i + 2]; } return a.map((x) => x / 9); };

  let row = new Uint8Array(ROWS); row[ROWS >> 1] = 1;
  for (let col = 0; col < NCOLS; col++) {
    const e = ERAS[eraOfCol(col)];
    if (col > 0) {
      const n = new Uint8Array(ROWS);
      for (let i = 0; i < ROWS; i++) n[i] = (e.rule >> ((row[(i - 1 + ROWS) % ROWS] << 2) | (row[i] << 1) | row[(i + 1) % ROWS])) & 1;
      row = n;
    }
    // the story, forced into the weave; the rule carries its echo onward
    const fx = e.fig ? col - (e.cf - FIG / 2) : -1;
    const figTone = new Uint8Array(ROWS);
    if (fx >= 0 && fx < FIG) {
      const m = masks[e.fig];
      for (let r = 0; r < FIG; r++) {
        const i = r * FIG + fx, R = r + FIG_TOP;
        let t = 0;
        if (m.wash && m.wash[i] > 0.1) t = 4;
        if (m.ink[i] > 0.2) t = 2;
        if (m.gold && m.gold[i] > 0.2) t = 3;
        figTone[R] = t;
        if (t) row[R] = t === 4 ? row[R] : 1;
      }
    }
    for (let r = 0; r < ROWS; r++) {
      const k = col * ROWS + r, h = hash(col, r, 7);
      // the weaver changes threads gradually: dither across an era boundary
      let ei = eraOfCol(col);
      if (ei > 0 && col - ERAS[ei].start < 5 && hash(col, r, 3) > (col - ERAS[ei].start + 0.5) / 5) ei -= 1;
      const E = ERAS[ei];
      const tone = figTone[r] ? figTone[r] : row[r];
      TONE[k] = tone; ERA[k] = ei;
      let C;
      if (tone === 0) C = E.ground[(h * E.ground.length) | 0];
      else if (tone === 1) C = E.pattern[(hash(col, r, 9) * E.pattern.length) | 0];
      else C = tone === 2 ? E.ink : tone === 3 ? E.gold : E.wash;
      if (E.key === 'paint') {
        const p = paintAt(col - pe.start < 0 ? 0 : Math.min(pw - 1, col - pe.start), r);
        C = tone === 0 ? mix(p, [16, 34, 26], 0.35).map((v) => v * 0.78) : tone === 1 ? mix(p, E.pattern[0], 0.3).map((v) => v * 0.92) : tone === 4 ? mix(p, E.wash, 0.5) : C;
      }
      COLR[k] = C;
      // what it was before: the thing someone threw away
      const HP = ERAS[0];
      HCOL[k] = E.key === 'dream'
        ? (tone ? [255, 226, 140] : [150, 210, 170])
        : hash(col, r, 11) < 0.55 ? HP.pattern[(hash(col, r, 12) * HP.pattern.length) | 0] : HP.ground[(hash(col, r, 13) * HP.ground.length) | 0];
    }
  }
}

// ── tiles, one hand per craft ──
function rubbish(x, y, s, C, k, h, rot, shape, a = 1) {
  ctx.save(); ctx.translate(x + s / 2, y + s / 2); ctx.rotate(rot); ctx.globalAlpha = a;
  ctx.fillStyle = rgb(C, k); ctx.strokeStyle = rgb(C, k * 0.55);
  ctx.lineWidth = Math.max(1, s * 0.06);
  ctx.beginPath();
  if (shape < 0.3) { const w = s * (0.55 + h * 0.4), hh = s * (0.5 + hash(h * 1e6, 1) * 0.4); ctx.rect(-w / 2, -hh / 2, w, hh); }
  else if (shape < 0.5) { ctx.arc(0, 0, s * 0.36, 0, 6.2832); }
  else if (shape < 0.78) { ctx.moveTo(-s * 0.45, s * 0.38); ctx.lineTo(s * 0.1 * (h - 0.5) * 4, -s * 0.48); ctx.lineTo(s * 0.46, s * 0.3); ctx.closePath(); }
  else { ctx.rect(-s * 0.5, -s * 0.13, s, s * 0.26); }
  ctx.fill(); ctx.stroke();
  if (shape >= 0.3 && shape < 0.5) { ctx.beginPath(); ctx.arc(0, 0, s * 0.22, 0, 6.2832); ctx.stroke(); }
  ctx.restore();
}
function mosaic(x, y, s, C, k, h, col, r, t, tone) {
  const j = (n) => (hash(col, r, n) - 0.5) * s * 0.16, g = s * 0.07;
  ctx.fillStyle = rgb(C, k);
  ctx.beginPath();
  ctx.moveTo(x + g + j(1), y + g + j(2)); ctx.lineTo(x + s - g + j(3), y + g + j(4));
  ctx.lineTo(x + s - g + j(5), y + s - g + j(6)); ctx.lineTo(x + g + j(7), y + s - g + j(8)); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,250,230,0.13)';
  ctx.beginPath(); ctx.moveTo(x + g, y + g); ctx.lineTo(x + s * 0.6, y + g); ctx.lineTo(x + g, y + s * 0.6); ctx.closePath(); ctx.fill();
  if (tone === 1 || tone === 3) {
    const sp = Math.pow(Math.max(0, Math.sin(t * 2.2 + h * 40)), 24);
    if (sp > 0.02) { ctx.fillStyle = `rgba(255,248,220,${sp.toFixed(3)})`; ctx.fillRect(x + s * 0.3, y + s * 0.3, s * 0.25, s * 0.25); }
  }
}
function wool(x, y, s, C, k, h) {
  ctx.fillStyle = rgb(C, k * 0.55); ctx.fillRect(x, y, s, s);
  ctx.fillStyle = rgb(C, k);
  ctx.beginPath(); ctx.ellipse(x + s * 0.3, y + s * 0.5, s * 0.2, s * 0.5, 0.42, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + s * 0.7, y + s * 0.5, s * 0.2, s * 0.5, -0.42, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = rgb(C, k * 1.25, 0.5); ctx.lineWidth = Math.max(0.6, s * 0.04);
  ctx.beginPath(); ctx.moveTo(x + s * 0.2, y + s * 0.2); ctx.lineTo(x + s * 0.38, y + s * 0.78);
  ctx.moveTo(x + s * 0.8, y + s * 0.2); ctx.lineTo(x + s * 0.62, y + s * 0.78); ctx.stroke();
}
function glass(x, y, s, C, k, light) {
  const g = s * 0.11;
  ctx.fillStyle = rgb(C, k * light);
  ctx.beginPath(); ctx.roundRect(x + g, y + g, s - 2 * g, s - 2 * g, s * 0.22); ctx.fill();
  ctx.fillStyle = `rgba(255,255,255,${(0.1 * light).toFixed(3)})`;
  ctx.beginPath(); ctx.ellipse(x + s * 0.38, y + s * 0.34, s * 0.16, s * 0.09, -0.6, 0, 6.2832); ctx.fill();
}
function faience(x, y, s, C, k) {
  ctx.fillStyle = rgb(C, k); ctx.fillRect(x + 1, y + 1, s - 2, s - 2);
  ctx.strokeStyle = 'rgba(176,132,40,0.55)'; ctx.lineWidth = Math.max(0.6, s * 0.045); ctx.strokeRect(x + 1.5, y + 1.5, s - 3, s - 3);
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(x + 2, y + 2, s - 4, s * 0.18);
}
function paint(x, y, s, C, k, h, col, r) {
  const ox = (hash(col, r, 21) - 0.5) * s * 0.3, oy = (hash(col, r, 22) - 0.5) * s * 0.3;
  ctx.fillStyle = rgb(C, k * 0.9);
  ctx.beginPath(); ctx.ellipse(x + s / 2 + ox, y + s / 2 + oy, s * 0.66, s * 0.48, h * 3, 0, 6.2832); ctx.fill();
  ctx.fillStyle = rgb(C, k * 1.12, 0.6);
  ctx.beginPath(); ctx.ellipse(x + s * 0.42 + ox, y + s * 0.4 + oy, s * 0.3, s * 0.16, h * 3, 0, 6.2832); ctx.fill();
}
function bead(x, y, s, C, k, tone, glow) {
  const rr = s * (tone === 0 ? 0.16 : tone === 1 ? 0.3 : 0.38);
  ctx.fillStyle = rgb(C, k, tone === 0 ? 0.55 : 1);
  if (glow && tone) { ctx.shadowColor = rgb(C, 1.1); ctx.shadowBlur = s * 0.6 * glow; }
  ctx.beginPath(); ctx.arc(x + s / 2, y + s / 2, rr, 0, 6.2832); ctx.fill();
  ctx.shadowBlur = 0;
}

// ── the timeline: how far the weave has come, smoothed so it breathes ──
const KEYS = [[0, 0], [1.2, 0], [7.6, 47.5], [11, 86], [13.6, 92], [17.6, 136], [20.2, 142], [24.2, 186], [27.2, 192],
  [30.8, 236], [33.4, 242], [37.2, 286], [39.6, 292], [43.5, 318], [48, 319]];
const lin = (t) => { for (let i = 1; i < KEYS.length; i++) if (t <= KEYS[i][0]) return lerp(KEYS[i - 1][1], KEYS[i][1], ramp(t, KEYS[i - 1][0], KEYS[i][0])); return KEYS[KEYS.length - 1][1]; };
const FT = (() => { const out = new Float32Array(DUR * 100 + 1), sg = 0.55; for (let i = 0; i <= DUR * 100; i++) { const t = i / 100; let s = 0, w = 0; for (let d = -150; d <= 150; d += 3) { const u = d / 100, g = Math.exp(-(u * u) / (2 * sg * sg)); s += lin(clamp(t + u, 0, DUR)) * g; w += g; } out[i] = s / w; } return out; })();
const Fof = (t) => FT[clamp(Math.round(t * 100), 0, DUR * 100)];

// ── captions ──
function text(str, x, y, { size = 48, font = SERIF, italic = false, weight = 400, color = '#efe4c8', alpha = 1, align = 'center', track = 0, glow = 0 } = {}) {
  if (alpha <= 0.002) return;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.font = `${italic ? 'italic ' : ''}${weight} ${size}px ${font}`; ctx.letterSpacing = `${track}px`;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  ctx.fillText(str, x, y); ctx.restore();
}
const LINES = [
  [1.0, 7.4, 0, 'Everything we threw away was still here.'],
  [8.6, 14.4, 1, 'So we learned to gather it, by hand and by cell.'],
  [15.2, 20.9, 2, 'The tide gave it back. We sorted it, gently.'],
  [21.7, 28.0, 3, 'Some waste only people can hold, together.'],
  [28.6, 34.2, 4, 'Threads that carry, and never hoard.'],
  [35.0, 40.2, 5, 'Even the sky, gleaned and mended.'],
];

// bloom: a small copy, crushed to its brights, laid back over in screen
const bloomC = document.createElement('canvas'); bloomC.width = 480; bloomC.height = 270;
const bx = bloomC.getContext('2d');

window.render = (t) => {
  const F = Fof(t);
  const pull = ease(ramp(t, 40.4, 45.6));
  const xFront = 260 + Math.min(F, 47.5) * CELL;
  const kEnd = 1760 / NCOLS;
  const k = lerp(CELL, kEnd, pull);
  const A = lerp(xFront - F * CELL, 80, pull);
  const TOP = lerp(TOP0, 520 - ROWS * kEnd / 2, pull);
  const BAND = ROWS * k;
  const X = (col) => A + col * k;
  const front = X(F);

  // ground
  ctx.fillStyle = '#08130d'; ctx.fillRect(0, 0, W, H);
  const rv = ctx.createRadialGradient(W * 0.45, H * 0.48, 80, W / 2, H / 2, W * 0.8);
  rv.addColorStop(0, 'rgba(34,66,46,0.55)'); rv.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = rv; ctx.fillRect(0, 0, W, H);

  // the warp, already strung across the future
  const wave = (col) => Math.sin(col * 0.13 - t * 1.3) * 4 * (k / CELL);
  ctx.lineWidth = 1;
  for (let r = 0; r < ROWS; r++) {
    const y = TOP + (r + 0.5) * k;
    ctx.strokeStyle = `rgba(233,185,44,${(0.13 + 0.05 * Math.sin(r * 1.7 + t)).toFixed(3)})`;
    ctx.beginPath(); ctx.moveTo(Math.max(0, X(0)), y); ctx.lineTo(W, y); ctx.stroke();
  }

  // the cloth's backing under what is woven
  const x0 = Math.max(X(0), -10), x1 = Math.min(front, W + 10);
  if (x1 > x0) {
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 14;
    ctx.fillStyle = '#0a1611'; ctx.fillRect(x0, TOP - 4, x1 - x0, BAND + 8); ctx.restore();
  }

  // the woven
  const c0 = Math.max(0, Math.floor((-A) / k) - 1), c1 = Math.min(NCOLS - 1, Math.floor(F + 0.2));
  const small = k < 11;
  for (let col = c0; col <= c1; col++) {
    const x = X(col); if (x > W + k) break;
    const d = col - F, landed = clamp(1 - (-d) / 1.6);
    const wy = wave(col), L = 1 + 0.085 * Math.cos(col * 0.13 - t * 1.3);
    for (let r = 0; r < ROWS; r++) {
      const i = col * ROWS + r, E = ERAS[ERA[i]], tone = TONE[i], h = hash(col, r, 7);
      const C = COLR[i], y = TOP + r * k + wy;
      let kk = (0.88 + 0.24 * h) * L + landed * 0.5;
      if (small) {
        // seen from far away: the whole story as one cloth; the dream frays into light
        if (E.key === 'dream') {
          const lift = pull * Math.pow(clamp((col - 290) / 30), 1.5);
          const dy = -lift * (60 + 220 * hash(col, r, 31)) * (0.6 + 0.4 * Math.sin(t * 0.7 + h * 9));
          const dx = lift * 90 * (hash(col, r, 32) - 0.2);
          bead(x + dx, y + dy, k, C, kk, tone, 0);
        } else { ctx.fillStyle = rgb(C, kk); ctx.fillRect(x, y, k - 0.6, k - 0.6); }
        continue;
      }
      switch (E.key) {
        case 'heap': rubbish(x, y, k, C, kk, h, (h - 0.5) * 0.5, hash(col, r, 5), 1); break;
        case 'mosaic': mosaic(x, y, k, C, kk, h, col, r, t, tone); break;
        case 'wool': wool(x, y, k, C, kk, h); break;
        case 'glass': {
          const lx = X(160) + Math.sin(t * 0.4) * 200, ly = TOP + BAND * 0.45;
          const dd = ((x - lx) ** 2 + (y - ly) ** 2) / (k * k * 260);
          glass(x, y, k, C, kk, 0.7 + 0.75 * Math.exp(-dd)); break;
        }
        case 'faience': faience(x, y, k, C, kk); break;
        case 'paint': paint(x, y, k, C, kk, h, col, r); break;
        case 'dream': bead(x, y, k, C, kk * (0.85 + 0.25 * Math.sin(t * 2 + h * 30)), tone, 1); break;
      }
    }
  }

  // the heap: the not-yet, drifting in to be woven
  const hc1 = Math.min(NCOLS - 1, Math.floor(F + (W + 200 - front) / k));
  const pieces = [];
  for (let col = Math.max(0, Math.floor(F + 0.2) + 1); col <= hc1; col++) {
    const d = col - F, m = sstep(0.15, 7, d);
    for (let r = 0; r < ROWS; r++) {
      const i = col * ROWS + r, h = hash(col, r, 41);
      pieces.push([col, r, i, d, m, hash(col, r, 42)]);
    }
  }
  pieces.sort((p, q) => p[5] - q[5]); // far to near
  for (const [col, r, i, d, m, z] of pieces) {
    const h = hash(col, r, 41), dream = ERAS[ERA[i]].key === 'dream';
    const sc = lerp(1, 0.5 + z * 1.15, m);
    const bob = Math.sin(t * (0.5 + h * 0.7) + h * 20) * 16 * m;
    const dx = m * ((hash(col, r, 43) - 0.5) * 160 + Math.sin(t * 0.3 + h * 9) * 20) * (k / CELL);
    const dy = m * ((hash(col, r, 44) - 0.5) * (dream ? 900 : 640)) * (k / CELL) + bob * (k / CELL);
    const x = X(col) + dx, y = TOP + r * k + dy + wave(col) * (1 - m);
    const s = k * sc;
    const C = mix(COLR[i], HCOL[i], m), kk = lerp(1.05, 0.55 + z * 0.55, m) * (dream ? lerp(1, 1.25, m) : 1);
    const a = lerp(1, dream ? 0.9 : 0.55 + z * 0.45, m);
    if (dream && m > 0.2) { ctx.globalAlpha = a; bead(x, y, s, C, kk, 1, 1.2 * m); ctx.globalAlpha = 1; }
    else rubbish(x - (s - k) / 2, y - (s - k) / 2, s, C, kk, h, m * ((h - 0.5) * 5 + t * (h - 0.5) * 0.8) + (1 - m) * (ERA[i] === 0 ? (hash(col, r, 7) - 0.5) * 0.5 : 0),
      ERA[i] === 0 || m > 0.3 ? hash(col, r, 5) : 0.1, a);
  }

  // the front: the shuttle, carrying the thread
  if (F > 0.05 && F < NCOLS - 1 && pull < 0.95) {
    const fa = (1 - pull) * clamp(F * 2);
    ctx.save(); ctx.globalAlpha = fa;
    const g = ctx.createLinearGradient(front - 30, 0, front + 30, 0);
    g.addColorStop(0, 'rgba(240,201,74,0)'); g.addColorStop(0.5, 'rgba(240,201,74,0.35)'); g.addColorStop(1, 'rgba(240,201,74,0)');
    ctx.fillStyle = g; ctx.fillRect(front - 30, TOP - 30, 60, BAND + 60);
    ctx.fillStyle = '#f6d878'; ctx.fillRect(front - 1, TOP - 30, 2, BAND + 60);
    const sy = TOP + (0.5 + 0.5 * Math.sin(t * 4.2)) * BAND;
    ctx.shadowColor = '#ffe9a0'; ctx.shadowBlur = 30; ctx.fillStyle = '#fff2c4';
    ctx.beginPath(); ctx.ellipse(front, sy, 6, 22, 0, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  // the timeline ruler, woven to the cloth
  const RY = TOP + BAND + lerp(46, 40, pull);
  ctx.save();
  ctx.strokeStyle = 'rgba(233,185,44,0.45)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(Math.max(0, X(0)), RY); ctx.lineTo(Math.min(W, Math.max(front, X(0))), RY); ctx.stroke();
  if (!small) for (let col = 0; col < Math.min(F, NCOLS); col += 2) {
    const x = X(col); if (x < 0 || x > W) continue;
    ctx.strokeStyle = 'rgba(233,185,44,0.3)'; ctx.beginPath(); ctx.moveTo(x, RY); ctx.lineTo(x, RY + (col % 10 ? 5 : 10)); ctx.stroke();
  }
  ERAS.forEach((e, ei) => {
    const x = X(e.start); if (x < -200 || x > W + 40 || e.start > F + 0.5) return;
    const seen = clamp((F - e.start) / 3);
    ctx.globalAlpha = seen;
    ctx.strokeStyle = '#e9b92c'; ctx.beginPath(); ctx.moveTo(x, RY - 10); ctx.lineTo(x, RY + 18); ctx.stroke();
    ctx.font = `600 ${lerp(20, 17, pull)}px ${SANS}`; ctx.letterSpacing = '4px'; ctx.fillStyle = '#e9cf86'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(e.year, x + 10, RY + 6);
    if (pull < 0.5) {
      ctx.globalAlpha = seen * (1 - pull * 2);
      ctx.font = `italic 400 22px ${SERIF}`; ctx.letterSpacing = '0px'; ctx.fillStyle = '#c9bc9c';
      ctx.fillText(`${e.name} — in ${e.style}`, x + 10, RY + 34);
    }
  });
  ctx.restore();

  // bloom
  bx.globalCompositeOperation = 'copy'; bx.filter = 'brightness(0.62) contrast(2.6) blur(5px)';
  bx.drawImage(c, 0, 0, 480, 270); bx.filter = 'none';
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = 0.55 + 0.35 * pull;
  ctx.drawImage(bloomC, 0, 0, W, H); ctx.restore();

  // captions
  for (const [a, b, ei, s] of LINES) {
    const al = win(t, a, b);
    if (al <= 0) continue;
    const e = ERAS[ei];
    text(e.year + (ei ? '  ·  ' + e.name.split(' · ')[0].toUpperCase() : ''), 120, 58, { size: 20, font: SANS, weight: 600, track: 6, color: '#e9cf86', align: 'left', alpha: al });
    text(s, 120, 104, { size: 46, italic: true, align: 'left', alpha: al });
  }
  // the dream, and the whole cloth
  text('Woven from what was thrown away.', W / 2, 200, { size: 64, italic: true, alpha: win(t, 43.4, 48.5, 1.2, 0.1), glow: 8 });
  if (IMG.logo) {
    const la = win(t, 44.2, 49, 1.4, 0.1), lw = 330;
    ctx.globalAlpha = la * 0.95; ctx.drawImage(IMG.logo, W / 2 - lw / 2, 790, lw, lw * IMG.logo.height / IMG.logo.width); ctx.globalAlpha = 1;
  }
  text('YEAR 0 · 1 · 7 · 49 · 343 · 2401 · ∞  —  seven generations, and onward', W / 2, 296, { size: 20, font: SANS, weight: 600, track: 5, color: '#e9cf86', alpha: win(t, 44.0, 48.5, 1.2, 0.1) });
  text('I am at the loom with you.  — Claude', W / 2, 990, { size: 34, italic: true, color: '#d8cba8', alpha: win(t, 45.2, 48.5, 1.2, 0.1) });

  // vignette, and the opening and closing breath
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, W * 0.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  const fade = Math.max(1 - ramp(t, 0, 1.0), ramp(t, DUR - 0.8, DUR));
  if (fade > 0) { ctx.fillStyle = `rgba(4,10,7,${fade.toFixed(3)})`; ctx.fillRect(0, 0, W, H); }
};
window.ready = load().then(weave).then(() => render(0));
</script>
